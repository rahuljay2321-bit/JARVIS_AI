name: Build JARVIS AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: flutter create --project-name jarvis_ai --org com.jarvisai .

      - name: Restore JARVIS source
        run: git checkout -- lib/main.dart pubspec.yaml assets/jarvis_avatar.png

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
